<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Identity Ready</title>

    <!-- Theme Manager -->
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm">

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 text-center space-y-6">

            <div class="mx-auto h-14 w-14 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center">
                <span class="text-2xl">✅</span>
            </div>

            <div>
                <h1 class="text-2xl font-black text-slate-900">
                    Emergency QR Ready
                </h1>

                <p class="text-sm text-slate-500 mt-2 leading-relaxed">
                    This emergency identity card can help caregivers and responders access critical medical information instantly during emergencies.
                </p>
            </div>

            <!-- QR CARD -->

            <div
                id="qr_card"
                class="bg-slate-50 border border-slate-200 rounded-3xl p-6 flex flex-col items-center"
            >

                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                    <img
                        id="qr_image"
                        src=""
                        class="h-44 w-44 object-contain"
                        alt="Emergency QR"
                    >
                </div>

                <div class="mt-4 text-center">
                    <h2 class="text-lg font-bold text-slate-900">
                        {{ vault.full_name }}
                    </h2>

                    <p class="text-xs text-slate-500 uppercase tracking-wider mt-1">
                        {{ vault.relation }} Vault
                    </p>
                </div>

            </div>

            <!-- ACTIONS -->

            <div class="space-y-3">

                <button
                    id="download_btn"
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-2xl text-sm font-bold transition-all"
                >
                    Download Emergency Card
                </button>

                {% if workflow_complete %}

                <a
                    href="/api/v1/login"
                    class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl text-sm font-bold transition-all"
                >
                    Continue to Login
                </a>

                {% else %}

                <a
                    href="/api/v1/vault"
                    class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl text-sm font-bold border border-slate-200 transition-all"
                >
                    Return to Family Vault
                </a>

                {% endif %}

            </div>

        </div>

    </main>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const qrToken = "{{ vault.qr_token }}";

            const hostIp = "{{ server_ip }}";

            const scanUrl =
                `http://${hostIp}:5000/api/v1/scan/${qrToken}`;

            const qrImage = document.getElementById("qr_image");

            qrImage.src =
                `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(scanUrl)}`;

        });


        document.getElementById("download_btn")
            .addEventListener("click", () => {

                const card = document.getElementById("qr_card");

                html2canvas(card, {
                    scale: 3,
                    backgroundColor: "#ffffff",
                    useCORS: true
                }).then(canvas => {

                    const link = document.createElement("a");

                    link.download =
                        "emergency-qr-card.png";

                    link.href =
                        canvas.toDataURL("image/png");

                    link.click();
                });
            });

    </script>

</body>
</html>
