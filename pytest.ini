[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Isolated unit tests for domain services, cryptography, schemas, and helper functions.
    integration: End-to-end multi-component workflows, database transactions, and API lifecycles.
    security: OWASP Top 10, API security, BOLA/IDOR, prompt-injection, SSRF, and cost guardrail tests.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
